    <div class="main-content">
        <!-- هنا المحتوى الأساسي لكل صفحة -->

        <h2>الموردين</h2>
        <form id="supplierForm">
            <input type="text" id="company" placeholder="اسم الشركة" required>
            <input type="text" id="invoice" placeholder="اسم الفاتورة" required>
            <input type="date" id="date" required>
            <input type="number" id="total" placeholder="إجمالي الفاتورة" required>
            <input type="number" id="paid" placeholder="المدفوع" required>
            <button type="submit">إضافة فاتورة</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>اسم الشركة</th>
                    <th>الفاتورة</th>
                    <th>التاريخ</th>
                    <th>الإجمالي</th>
                    <th>المدفوع</th>
                    <th>الباقي</th>
                </tr>
            </thead>
            <tbody id="supplierTable"></tbody>
        </table>
    </div>
