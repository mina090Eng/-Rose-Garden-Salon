    <div class="main-content">
        <!-- هنا المحتوى الأساسي لكل صفحة -->

        <h2>العمال</h2>
        <form id="employeeForm">
            <input type="text" id="name" placeholder="اسم العامل" required>
            <input type="number" id="salary" placeholder="المرتب" required>
            <input type="number" id="loan" placeholder="السلفة">
            <input type="time" id="checkin" required>
            <input type="time" id="checkout" required>
            <button type="submit">إضافة عامل</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>المرتب</th>
                    <th>السلفة</th>
                    <th>وقت الحضور</th>
                    <th>وقت الانصراف</th>
                </tr>
            </thead>
            <tbody id="employeeTable"></tbody>
        </table>
